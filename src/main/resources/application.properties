spring.application.name=Helpdesk

# 1. Conexao com o Banco (com parametro para criar o banco automaticamente)
spring.datasource.url=jdbc:mysql://localhost:3306/att_helpD?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# COLOQUE A SUA SENHA DO MYSQL ABAIXO (se nao tiver senha, deixe depois do '=' em branco)
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configurações do JPA / Hibernate (Dialeto travado para evitar o erro de Metadata)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Suporte a Enums
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.mvc.format.enum-case-sensitive=false
